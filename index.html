<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e4d35">
<meta name="color-scheme" content="light">
<title>우신중학교 QUIZ SHOW</title>
<link rel="icon" href="assets/mascot-face.webp" type="image/webp">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
/* 나눔스퀘어라운드 (jsDelivr · projectnoonnu) */
@font-face {
    font-family: 'NanumSquareRound';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
    font-weight: normal;
    font-display: swap;
}

:root{
  --green-900:#0a3624; --green-800:#0e4d35; --green:#17825a; --mint:#35c58b; --mint-soft:#e1f6ec;
  --cream:#f7f3e9; --ink:#14231b; --muted:#5a6b61; --line:#d6e2da; --yellow:#f5b301; --yellow-soft:#fff1c2;
  --a0:#e5384f; --a1:#2f6fd0; --a2:#f0b400; --a3:#1f9d64;
  --radius:20px; --font-body:"NanumSquareRound",system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --font-display:var(--font-body);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);display:flex;flex-direction:column;color:var(--ink);background:var(--cream);min-height:100vh;min-height:100dvh;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 6% -6%,#c6f0dc 0,transparent 62%),radial-gradient(760px 520px at 100% 100%,#ffe8a3 0,transparent 58%),radial-gradient(#0e4d3512 1.2px,transparent 1.2px) 0 0/22px 22px,var(--cream)}
img{max-width:100%;height:auto;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hidden{display:none!important}
.display{font-family:var(--font-display);font-weight:900;letter-spacing:-.01em}
.muted{color:var(--muted)}
#app{flex:1 0 auto;display:flex;flex-direction:column;width:100%}
#view{flex:1 0 auto}
.sitefoot{flex-shrink:0;text-align:center;padding:18px 16px max(18px,env(safe-area-inset-bottom));font-size:clamp(9.5px,2.9vw,12px);font-weight:600;color:var(--muted);white-space:nowrap}
.sitefoot b{font-weight:800;color:var(--green-800);letter-spacing:.06em}
.sitefoot .ver{display:inline-block;margin-left:6px;padding:1px 8px;border:1.5px solid var(--green-800);border-radius:999px;background:#fff;color:var(--green-800);font-weight:800}
body.proj .sitefoot{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 바 */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(12px,3vw,28px);padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:3px solid var(--green-800)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:48px;height:48px;flex:none;border-radius:14px;background:var(--mint-soft);border:2px solid var(--green-800);object-fit:cover}
.brand b{display:block;font-family:var(--font-display);font-weight:900;font-size:clamp(17px,2.6vw,24px);color:var(--green-800);line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;padding:4px;background:var(--mint-soft);border-radius:16px;border:2px solid var(--green-800);flex:none}
.tab{padding:10px 18px;min-height:44px;border-radius:12px;font-weight:900;color:var(--green-800)}
.tab[aria-selected="true"]{background:var(--green-800);color:#fff}
@media(max-width:640px){.topbar{flex-wrap:wrap}.tabs{width:100%}.tab{flex:1;padding:10px 6px}}
.proj .topbar{display:none}

.banner{padding:9px 16px;text-align:center;font-weight:700;font-size:14px;background:var(--yellow-soft);border-bottom:2px solid #d9a800;color:#5b4300}
.banner.err{background:#ffe1e1;border-color:#d33;color:#8a1111}

/* 공통 컴포넌트 */
.page{width:min(1200px,100%);margin:0 auto;padding:clamp(14px,3vw,30px)}
.page.narrow{width:min(560px,100%)}
.card{background:#fff;border:3px solid var(--green-800);border-radius:var(--radius);box-shadow:6px 6px 0 var(--green-800)}
.pad{padding:clamp(16px,3vw,28px)}
.stack{display:grid;gap:20px;align-content:start}
@media(max-width:560px){.card{box-shadow:4px 4px 0 var(--green-800);border-radius:18px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:900;border:3px solid var(--green-800);background:#fff;color:var(--green-800);box-shadow:3px 3px 0 var(--green-800);transition:transform .08s,box-shadow .08s,filter .15s;text-align:center}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--green-800)}
.btn.primary{background:var(--mint);color:var(--green-900)}
.btn.accent{background:var(--yellow);color:#2b1f00}
.btn.danger{background:#ffe3e3;color:#9a1212;border-color:#9a1212;box-shadow:3px 3px 0 #9a1212}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.xl{min-height:64px;font-size:clamp(18px,4.6vw,24px);width:100%}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:3px 3px 0 var(--green-800),0 0 0 6px rgba(53,197,139,.5)}}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--mint-soft);border:2px solid var(--green-800);font-weight:800;font-size:14px;color:var(--green-800)}
.chip.warn{background:var(--yellow-soft)}
h1.display{font-size:clamp(26px,5vw,44px);line-height:1.1;color:var(--green-800)}
h2.display{font-size:clamp(20px,3.6vw,30px);color:var(--green-800)}
.field{display:grid;gap:6px}
.field>label,.label{font-weight:900;color:var(--green-800)}
.in{width:100%;height:64px;padding:0 18px;border-radius:16px;border:3px solid var(--green-800);background:#fff;font-size:22px;font-weight:700}
.in::placeholder{color:#9aaba1;font-weight:500}
.in:focus{outline:none;box-shadow:0 0 0 4px #f5b30188}
.msg{min-height:22px;font-weight:700;color:#b3261e}
.msg.ok{color:var(--green)}

/* 참가자 입장 */
.join{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(16px,3vw,34px);align-items:start}
.hero{position:relative;background:linear-gradient(160deg,var(--mint-soft),#fff 70%);overflow:hidden;display:grid;justify-items:center;gap:8px;padding:clamp(14px,3vw,24px)}
.hero img.m{width:min(300px,70%);filter:drop-shadow(0 10px 0 rgba(14,77,53,.18))}
.hero .bubble{justify-self:start;background:var(--yellow);border:3px solid var(--green-800);border-radius:16px 16px 16px 4px;padding:8px 14px;font-weight:900;font-size:15px;color:#2b1f00;width:fit-content}
.hero .tag{font-weight:900;color:var(--green-800);text-align:left}
.hero .hero-text{display:grid;gap:10px;justify-items:start;justify-self:stretch}
.picker{display:grid;gap:10px}
.grade-row{display:grid;grid-template-columns:62px repeat(4,minmax(0,1fr));gap:8px;align-items:center}
.grade-label{font-weight:900;color:var(--green-800);font-size:15px}
.tile{min-height:58px;border-radius:14px;border:3px solid var(--green-800);background:#fff;font-weight:900;font-size:clamp(16px,4.4vw,22px);color:var(--green-800);transition:transform .08s}
.tile:hover{background:var(--mint-soft)}
.tile[aria-pressed="true"]{background:var(--green-800);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 var(--yellow)}
.picked{font-weight:900;min-height:24px;color:var(--green)}
@media(max-width:860px){
  .join{grid-template-columns:1fr}
  .hero{grid-template-columns:auto 1fr;justify-items:start;align-items:center;gap:12px}
  .hero img.m{width:clamp(96px,28vw,150px);justify-self:end;margin-left:auto}
}
@media(max-width:380px){.grade-row{grid-template-columns:48px repeat(4,minmax(0,1fr));gap:6px}.in{font-size:20px}}

/* 참가자 플레이 화면 */
.me-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.me-bar .who{font-weight:900;color:var(--green-800)}
.p-card{padding:clamp(16px,3.4vw,30px);display:grid;gap:16px;text-align:center;justify-items:center}
.p-card.left{text-align:left;justify-items:stretch}
.p-card img.m{width:min(260px,62vw);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.bignum{font-family:var(--font-display);font-weight:900;font-size:clamp(80px,26vw,170px);line-height:.9;color:var(--yellow);-webkit-text-stroke:3px var(--green-800);text-shadow:5px 5px 0 var(--green-800)}
.p-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900;color:var(--green-800)}
.p-timer{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,8vw,44px);min-width:2.2ch;text-align:right}
.bar{height:14px;border-radius:99px;background:#e5ece7;border:2px solid var(--green-800);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--mint);transition:width .25s linear}
.p-qtext{font-size:clamp(20px,5.2vw,30px);font-weight:900;line-height:1.3;text-align:left}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{min-height:clamp(84px,16vh,150px);border-radius:18px;border:3px solid rgba(0,0,0,.2);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:clamp(17px,2.3vw,30px);font-weight:900;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.25);width:100%;transition:transform .1s,filter .2s,opacity .2s}
.ans .sym{font-size:1.35em;flex:none;width:1.3em;text-align:center}
.ans .txt{min-width:0}
.ans .sym,.choice .sym{color:#fff}
.ans2 .sym,.choice.ans2 .sym{text-shadow:0 0 3px rgba(0,0,0,.5)}
.ans0{background:var(--a0)}.ans1{background:var(--a1)}.ans2{background:var(--a2);color:#2a1f00}.ans3{background:var(--a3)}
button.ans:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.ans:disabled{cursor:default}
.ans.dim{opacity:.28;filter:grayscale(.6)}
.ans.pick{outline:5px solid var(--green-900);outline-offset:2px}
.ans.correct{outline:6px solid #fff;box-shadow:0 0 0 9px var(--green-800),0 0 36px #fff9}
@media(max-width:640px){.answers{grid-template-columns:1fr}.ans{min-height:78px}}
.status{font-weight:900;padding:10px 14px;border-radius:14px;background:var(--mint-soft);border:2px dashed var(--green-800);color:var(--green-800)}
.verdict{font-family:var(--font-display);font-weight:900;font-size:clamp(34px,9vw,60px);line-height:1.1}
.verdict.ok{color:var(--green)}.verdict.no{color:#c0312f}
.pts{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,7vw,44px);color:var(--green-800)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.stat{background:var(--mint-soft);border:2px solid var(--green-800);border-radius:14px;padding:10px 6px}
.stat b{display:block;font-family:var(--font-display);font-weight:900;font-size:clamp(20px,5vw,30px);color:var(--green-800)}
.stat small{font-size:12px;color:var(--muted);font-weight:700}

/* 순위 목록 */
.rank-list{display:grid;gap:8px;width:100%}
.rrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--green-800);border-radius:14px;background:#fff;text-align:left}
.rrow.me{background:var(--yellow-soft);border-width:3px}
.rk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--mint-soft);border:2px solid var(--green-800);font-weight:900;font-size:16px}
.rk.m1{background:#ffd84d}.rk.m2{background:#dfe5e8}.rk.m3{background:#e7b27c}
.rname{font-weight:900;min-width:0}.rname small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.rval{font-weight:900;text-align:right;white-space:nowrap}.rval small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.crow{display:grid;grid-template-columns:46px minmax(110px,.9fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--green-800);border-radius:14px;background:#fff;text-align:left}
.crow.me{background:var(--yellow-soft);border-width:3px}
.cbar{height:18px;border-radius:99px;background:#e5ece7;overflow:hidden;border:2px solid var(--green-800)}
.cbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--green));min-width:6px}
@media(max-width:560px){.crow{grid-template-columns:40px minmax(0,1fr) auto}.crow .cbar{grid-column:1/-1;order:5;height:12px}}
.basis{font-size:13px;font-weight:800;text-align:right}
.crow .rname{white-space:nowrap}
.mine-box{width:100%;display:grid;gap:4px;padding:12px;border-radius:16px;background:var(--yellow-soft);border:3px solid var(--green-800);font-weight:900}

/* 관리자 */
.gate{display:grid;gap:14px;justify-items:center;text-align:center}
.gate img{width:96px;height:96px;border-radius:24px;background:var(--mint-soft);border:3px solid var(--green-800)}
.gate form{display:grid;gap:12px;width:100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.admin-head{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:20px}
.admin-head .chips{display:flex;gap:8px;flex-wrap:wrap}
.admin-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:980px){.admin-grid{grid-template-columns:1fr}}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qcard{border:3px solid var(--green-800);border-radius:18px;padding:14px;margin-top:14px;background:#fbfdfb;display:grid;gap:12px}
.qtop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.qno{font-size:26px;color:var(--green-800);line-height:1.3}
.ta{width:100%;min-height:64px;resize:vertical;padding:10px 12px;border-radius:12px;border:2px solid var(--green-800);background:#fff;font-size:16px}
.ti{width:100%;height:44px;padding:0 10px;border-radius:10px;border:2px solid var(--green-800);background:#fff;color:var(--ink);font-size:16px;min-width:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:center;padding:8px;border-radius:12px;color:#fff;border:2px solid rgba(0,0,0,.2)}
.choice.ans2{color:#2a1f00}
.choice .ti{border-color:rgba(0,0,0,.3)}
.choice input[type=radio]{width:22px;height:22px;accent-color:#0a3624}
.choice .sym{font-weight:900;font-size:18px}
@media(max-width:600px){.choices{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini label{font-size:12px;font-weight:800;color:var(--green-800);display:grid;gap:3px}
@media(max-width:600px){.mini{grid-template-columns:1fr 1fr}}
.qact{display:flex;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label{font-size:13px;font-weight:800;color:var(--green-800);display:grid;gap:4px}
.check{display:flex!important;grid-template-columns:none!important;align-items:center;gap:10px;font-weight:800}
.check input{width:22px;height:22px;accent-color:var(--green-800);flex:none}
.cls-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.roster{max-height:340px;overflow:auto;display:grid;gap:8px;margin-top:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px}
.prow b{display:block}.prow small{color:var(--muted)}
.prow .acts{display:flex;gap:6px}
.filters{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}
.cta-bar{position:sticky;bottom:0;z-index:40;margin:24px calc(-1*clamp(14px,3vw,30px)) calc(-1*clamp(14px,3vw,30px));padding:12px clamp(14px,3vw,30px);padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-top:3px solid var(--green-800);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-bar .btn{flex:1 1 280px}
.cta-bar.v2{flex-direction:column;align-items:stretch;gap:8px}
.cta-bar.v2 .btn{flex:0 0 auto}
.savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctas{display:flex;flex-wrap:wrap;gap:10px}
.cta-bar.v2 .ctas .btn{flex:1 1 150px;min-height:56px}

/* 라이브(진행자) */
.live{display:grid;gap:14px}
.live-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.live-head h1{font-size:clamp(20px,3.4vw,32px)}
.pill{padding:6px 14px;border-radius:999px;background:var(--green-800);color:#fff;font-weight:900}
.stage{min-height:clamp(320px,52vh,720px);padding:clamp(18px,4vw,52px);display:flex;align-items:center;position:relative;overflow:hidden}
.stage>.in-stage{width:100%;display:grid;gap:clamp(14px,2.4vw,28px)}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:20px;align-items:center}
.intro .m{width:min(360px,100%);justify-self:center;filter:drop-shadow(0 10px 0 rgba(14,77,53,.18))}
@media(max-width:760px){.intro{grid-template-columns:1fr}.intro .m{max-width:200px}}
.kicker{font-weight:900;letter-spacing:.2em;color:var(--green)}
.q-text{font-size:clamp(26px,4.6vw,64px);line-height:1.2;font-weight:900;letter-spacing:-.03em}
.q-row{display:flex;gap:18px;align-items:center;justify-content:space-between}
.ring{--p:100;flex:none;width:clamp(84px,12vw,140px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#e5ece7 0);display:grid;place-items:center;border:3px solid var(--green-800)}
.ring b{width:78%;aspect-ratio:1;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:clamp(28px,5vw,56px);color:var(--green-800)}
.live-stats{display:flex;gap:10px;flex-wrap:wrap;font-weight:900}
.explain{padding:12px 16px;border-radius:14px;background:var(--mint-soft);border:2px solid var(--green-800);font-weight:700;font-size:clamp(15px,1.8vw,22px)}
.res-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media(max-width:860px){.res-grid{grid-template-columns:1fr}}
.dist{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px;font-weight:900}
.dist .sym{display:grid;place-items:center;height:30px;border-radius:8px;color:#fff;font-size:14px}
.dist .bar{height:20px}.dist .bar i{background:var(--mint)}
.dist.ok .bar i{background:var(--green)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg .btn[aria-pressed="true"]{background:var(--green-800);color:#fff}
.controls{position:sticky;bottom:8px;z-index:30;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:rgba(255,255,255,.96)}
.controls .grow{flex:1 1 auto}
.controls .btn.main{flex:1 1 240px;min-height:56px;font-size:18px}

/* ═════════════ 1. 데이터 저장소 (Firebase / 로컬 테스트) ═════════════ */
function makeLocal() {
  const KEY = 'ws2026_local_db';
  const listeners = new Set();
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const keys = p => p.split('/').filter(Boolean);
  const getAt = (t, p) => keys(p).reduce((a, k) => (a == null ? undefined : a[k]), t);
  const setAt = (t, p, v) => {
    const ks = keys(p); let o = t;
    ks.slice(0, -1).forEach(k => { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; });
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  };
  const notify = () => listeners.forEach(l => l());
  window.addEventListener('storage', e => { if (e.key === KEY) notify(); });
  return {
    mode: 'local',
    now: () => Date.now(),
    async get(p) { const v = getAt(read(), p); return v === undefined ? null : JSON.parse(JSON.stringify(v)); },
    async set(p, v) { const t = read(); setAt(t, p, v); localStorage.setItem(KEY, JSON.stringify(t)); notify(); },
    async remove(p) { return this.set(p, null); },
    async update(obj) { const t = read(); for (const k in obj) setAt(t, k, obj[k]); localStorage.setItem(KEY, JSON.stringify(t)); notify(); },
    watch(p, cb) {
      let last;
      const run = () => {
        const v = getAt(read(), p); const s = JSON.stringify(v === undefined ? null : v);
        if (s !== last) { last = s; cb(v === undefined ? null : JSON.parse(s)); }
      };
      listeners.add(run); queueMicrotask(run);
      return () => listeners.delete(run);
    }
  };
}
async function makeFirebase(cfg) {
  const V = '10.14.1';

  const app = appM.initializeApp(cfg);
  const db = dbM.getDatabase(app);
  let offset = 0;
  dbM.onValue(dbM.ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
  const R = p => dbM.ref(db, ROOT + '/' + p);
  return {
    mode: 'firebase',
    now: () => Date.now() + offset,
    async get(p) { return (await dbM.get(R(p))).val(); },
    set: (p, v) => dbM.set(R(p), v === undefined ? null : v),
    remove: p => dbM.remove(R(p)),
    update(obj) { const o = {}; for (const k in obj) o[ROOT + '/' + k] = obj[k] === undefined ? null : obj[k]; return dbM.update(dbM.ref(db), o); },
    watch: (p, cb) => dbM.onValue(R(p), s => cb(s.val()), err => dbError(err))
  };
}

/* ── 서버(Firebase) 저장: 문제·점수 설정을 암호화해 DB(adminCfg)에 보관 → 어느 기기에서든 이어서 사용 ── */
const CFG_PATH = 'adminCfg';

const enc8 = new TextEncoder(), dec8 = new TextDecoder();
const toB64 = u8 => { let s = ''; u8.forEach(b => s += String.fromCharCode(b)); return btoa(s); };

const cfgKey = () => _ck || (_ck = crypto.subtle.importKey('raw', enc8.encode(ADMIN_PW), 'PBKDF2', false, ['deriveKey'])
  .then(k => crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc8.encode('ws2026-quiz-cfg-v1'), iterations: 120000, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt'])));
async function encryptCfg(obj) {
  const txt = enc8.encode(JSON.stringify(obj));
  if (!(window.crypto && crypto.subtle)) return { enc: 0, data: toB64(txt) };
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await cfgKey(), txt));
  return { enc: 1, iv: toB64(iv), data: toB64(ct) };

async function decryptCfg(rec) {
  if (!rec.enc) return JSON.parse(dec8.decode(fromB64(rec.data)));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(rec.iv) }, await cfgKey(), fromB64(rec.data));
  return JSON.parse(dec8.decode(new Uint8Array(pt)));

    } else if (!cfgRemote.synced && (localStorage.getItem(LIB_KEY) || localStorage.getItem(CFG_KEY))) {                       // 서버에 아직 없으면 이 기기의 저장본을 올림

function validateQuestions(cfg = CFG) {
  if (!cfg.questions.length) return { i: 0, why: '문제가 하나도 없어요.' };
  for (let i = 0; i < cfg.questions.length; i++) {
    const q = cfg.questions[i];
    if (!String(q.text).trim()) return { i, why: '문제 내용이 비어 있어요.' };
    if (q.choices.length !== 4 || q.choices.some(c => !String(c).trim())) return { i, why: '보기 4개를 모두 입력해 주세요.' };
    if (!(q.correct >= 1 && q.correct <= 4)) return { i, why: '정답을 선택해 주세요.' };
    if (!(q.timer >= 5 && q.timer <= 300)) return { i, why: '제한 시간은 5~300초로 입력해 주세요.' };

function rowsClassQ(rows, basis, meKeyV) {

async function submitAnswer(choice) {
  const L = S.live;
  if (!P.me || !L || L.phase !== 'question' || L.paused || P.ans.choice) return;
  if (L.endsAt && DB.now() > L.endsAt) { P.expired = true; renderPlay(true); return; }
  P.ans.choice = choice; renderPlay(true);                       // 즉시 잠금
  try { await DB.set(`answers/${L.qId}/${P.me.pid}`, { choice, t: DB.now() }); }
  catch (err) { console.error(err); P.ans.choice = 0; renderPlay(true); toast('제출에 실패했어요. 다시 눌러 주세요.'); }
}
function participantTick(force) {
  const L = S.live;
  if (R.route !== 'join' || !P.me || !L || L.phase !== 'question') return;
  const t = $('#pT'); if (!t) return;
  const total = (L.question.timer || 20) * 1000;
  const rem = L.paused ? (L.remainingMs || 0) : Math.max(0, (L.endsAt || 0) - DB.now());
  t.textContent = Math.ceil(rem / 1000);
  const b = $('#pBar'); if (b) b.style.width = Math.min(100, rem / total * 100) + '%';
  if (rem <= 0 && !L.paused && !P.expired) { P.expired = true; renderPlay(true); }
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#35c58b', '#f5b301', '#e5384f', '#2f6fd0', '#0e4d35'];
  for (let i = 0; i < 70; i++) { const s = document.createElement('i'); s.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % 5]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s`; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 7000);
}

function onLive() {
  const L = S.live, q = L ? L.qId : null;
  if (P.me && q !== P.ans.q) {
    if (P.ansUnsub) P.ansUnsub();
    P.ans = { q, choice: 0 }; P.expired = false;
    P.ansUnsub = q ? DB.watch(`answers/${q}/${P.me.pid}`, v => { const c = v ? v.choice : 0; if (c !== P.ans.choice) { P.ans.choice = c; if (R.route === 'join') renderPlay(); } }) : null;
  }
  const sk = L ? L.phase + '|' + L.qId : '';
  if (sk !== P._sk) { P._sk = sk; P.expired = false; }
  syncG();
  if (A.ok || R.route === 'screen') {
    if (q !== H.ansQ) {
      if (H.ansUnsub) H.ansUnsub();

      H.ansUnsub = q ? DB.watch('answers/' + q, v => { H.ansCount = v ? Object.keys(v).length : 0; hostCounts(); }) : null;
    }
    scheduleAuto();
  }
  refresh();
}

function readQuizFile(f, cb) {

      if (!Array.isArray(d.questions) || !d.questions.length) throw 0;
      const cfg = normCfg({ ...d, questions: d.questions.map(q => ({ id: q.id || newId(), text: q.text || '', choices: [0, 1, 2, 3].map(k => (q.choices || [])[k] || ''), correct: Number(q.correct) || 1, explanation: q.explanation || '', timer: Number(q.timer) || 20, baseScore: q.baseScore ?? null, bonus: q.bonus ?? q.correctBonus ?? null })) });
      cb({ title: d.title, cfg });

  };
  rd.readAsText(f);
}

async function closeQuestion() {

async function doReveal() {
  const L = S.live, q = G.questions.find(x => x.id === L.qId) || G.questions[L.qIndex];
  let res = (await DB.get('scored/' + q.id)) ? await DB.get('results/' + q.id) : null;
  if (!res) res = await scoreQuestion(q, L.endsAt);
  await DB.update({ 'live/phase': 'reveal', 'live/reveal': { correct: q.correct, explanation: q.explanation || '', responses: res.responses, correctCount: res.correctCount, distribution: toArr(res.distribution), formula: res.formula } });
}
async function scoreQuestion(q, endsAt) {
  const sc = G.scoring, basis = G.classBasis;
  const base = q.baseScore == null ? sc.base : q.baseScore, fast = q.bonus == null ? sc.fast : q.bonus;
  const [answers, players, scores] = await Promise.all([DB.get('answers/' + q.id), DB.get('players'), DB.get('scores')]);
  const A_ = answers || {}, PL = players || {}, SC = scores || {};
  const entries = Object.entries(A_).filter(([pid, a]) => PL[pid] && a && a.choice >= 1 && a.choice <= 4 && (!endsAt || a.t <= endsAt + 1500)).sort((a, b) => a[1].t - b[1].t);
  const ansBy = {}; entries.forEach(([pid, a]) => ansBy[pid] = a);
  let firstDone = false; const dist = [0, 0, 0, 0]; let correctCount = 0;
  const next = {}, qRows = [];
  for (const pid of Object.keys(PL)) {
    const prev = SC[pid] || {}, a = ansBy[pid];
    let points = 0, correct = false, streak = 0, choice = 0;
    if (a) {
      choice = a.choice; dist[choice - 1]++; correct = choice === q.correct;
      if (correct) {
        points = base + (!firstDone ? fast : 0) + ((prev.streak || 0) > 0 ? sc.streak : 0) + (sc.classBonusOn ? sc.classBonus : 0);
        firstDone = true; streak = (prev.streak || 0) + 1; correctCount++;
      }
    }
    next[pid] = { total: (prev.total || 0) + points, streak, correct: (prev.correct || 0) + (correct ? 1 : 0), answered: (prev.answered || 0) + (a ? 1 : 0), last: { qId: q.id, choice, correct, points } };
    qRows.push({ pid, name: PL[pid].name, key: PL[pid].g + '-' + PL[pid].c, points, correct, answered: !!a, total: next[pid].total, t: a ? a.t : 9e15 });
  }
  // 개인 누적 순위
  const cum = Object.keys(PL).map(pid => ({ pid, name: PL[pid].name, key: PL[pid].g + '-' + PL[pid].c, total: next[pid].total, points: next[pid].last.points }));
  rankDesc(cum, 'total'); const rankOf = {}; cum.forEach(r => rankOf[r.pid] = r.rank);
  // 반 누적
  const clsAgg = aggregateClasses(PL, next, basis);
  const clsRank = {}; clsAgg.forEach(c => clsRank[c.key] = c.rank);
  Object.keys(next).forEach(pid => { next[pid].rank = rankOf[pid]; next[pid].classRank = clsRank[PL[pid].g + '-' + PL[pid].c]; });
  // 이번 문제 순위
  const qInd = qRows.filter(r => r.answered).sort((a, b) => (b.points - a.points) || (a.t - b.t)).slice(0, 10).map(r => ({ pid: r.pid, name: r.name, key: r.key, points: r.points, total: r.total }));
  let rr = 0, pv = null; qInd.forEach((r, i) => { if (r.points !== pv) { rr = i + 1; pv = r.points; } r.rank = rr; });
  const qCls = {};
  qRows.forEach(r => { const c = qCls[r.key] || (qCls[r.key] = { key: r.key, count: 0, resp: 0, ok: 0, points: 0 }); c.count++; c.points += r.points; if (r.answered) c.resp++; if (r.correct) c.ok++; });
  const qClasses = Object.values(qCls).map(c => ({ key: c.key, count: c.count, points: c.points, avg: Math.round(c.points / c.count), accuracy: c.resp ? Math.round(c.ok / c.resp * 100) : 0, sortv: basis === 'avg' ? c.points / c.count : c.points }));
  rankDesc(qClasses, 'sortv');
  const responses = entries.length;
  const formula = `기본 ${base}점 + 가장 빠른 정답 ${fast}점 + 연속 정답 ${sc.streak}점${sc.classBonusOn ? ' + 반 대항 ' + sc.classBonus + '점' : ''}`;
  const res = { responses, correctCount, distribution: dist, formula };
  const upd = { ['scored/' + q.id]: true, ['results/' + q.id]: res, board: { qId: q.id, at: DB.now(), basis, individual: cum.slice(0, 10).map(({ pid, name, key, total, rank }) => ({ pid, name, key, total, rank })), classes: clsAgg, qInd, qClasses } };
  Object.keys(next).forEach(pid => upd['scores/' + pid] = next[pid]);
  await DB.update(upd);
  return res;
}
function aggregateClasses(PL, scoreMap, basis) {
  const m = {};
  Object.keys(PL).forEach(pid => { const k = PL[pid].g + '-' + PL[pid].c; const c = m[k] || (m[k] = { key: k, count: 0, total: 0 }); c.count++; c.total += (scoreMap[pid] ? scoreMap[pid].total : 0); });
  const arr = Object.values(m).map(c => ({ ...c, avg: Math.round(c.total / c.count), sortv: basis === 'avg' ? c.total / c.count : c.total }));
  rankDesc(arr, 'sortv'); return arr.map(({ key, count, total, avg, rank }) => ({ key, count, total, avg, rank }));
}
function nextQuestion() {

const PHASE_NAME = { lobby: '대기', intro: '문제 소개', question: '답안 제출', closed: '집계 중', reveal: '정답 공개', results: '이번 문제 순위', leaderboard: '개인 누적 순위', classboard: '반별 누적 순위', podium: '최종 결과' };

}

  const sig = L ? [L.phase, L.qId, L.paused, b && b.at, L.resTab, L.reveal ? 1 : 0].join('|') : 'none';
  if (sig !== H.sig) { H.sig = sig; $('#stage').innerHTML = L ? hostStage() : `<div class="in-stage">${lobbyHTML(null)}</div>`; afterStage(L || { phase: 'lobby' }); }
  if (L && !lobby) setHeadTexts(L);
  hostCounts(); hostTick(); updMusicUi();
}
function startScreenSubs() {
  DB.watch('players', v => { H.players = v || {}; hostCounts(); });
  const ping = () => Promise.resolve(DB.set('screenAt', DB.now())).catch(() => {});
  ping(); setInterval(ping, 10000);
}

/* ═════════════ 12. 시작 ═════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (R.route !== 'admin' || A.view !== 'live' || e.target.matches('input,textarea,select,button')) return;
  if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); advance(); syncMusic(); }
  if (e.key.toLowerCase() === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
});
document.addEventListener('click', e => {
  if (MUS.blocked) syncMusic();
  const t = e.target.closest('.tab'); if (t) go(t.dataset.route);
  if (e.target.closest('#mClose')) closeModal();
});

if (new URLSearchParams(location.search).has('screen')) { R.route = 'screen'; document.body.classList.add('screen'); document.title = EVENT_TITLE + ' · 대형화면'; }
(async function boot() {
  const cfg = window.FIREBASE_CONFIG || {};
  let note = '';
  if (cfg.databaseURL) {
    try { DB = await makeFirebase(cfg); }
    catch (err) { console.error(err); DB = makeLocal(); note = '<div class="banner err">Firebase 연결에 실패해 테스트 모드로 실행 중이에요. 설정을 확인해 주세요.</div>'; }
  } else {
    DB = makeLocal();
    note = '<div class="banner">🧪 테스트 모드 — Firebase 설정 전이라 같은 브라우저의 다른 탭끼리만 연결돼요. 학생 기기와 연결하려면 README.md의 설정을 따라주세요.</div>';
  }
  $('#banner').innerHTML = note;
  DB.watch('live', v => { S.live = v; onLive(); if (R.route === 'admin' && A.view === 'setup') updateSaveUi(); });
  DB.watch('board', v => { S.board = v; refresh(); });
  if (R.route === 'screen') startScreenSubs();
  else if (P.me) subscribeMe();
  if (A.ok && R.route !== 'screen') startAdminSubs();
  setInterval(() => { participantTick(); hostTick(); }, 250);
  setInterval(syncMusic, 1000);
  if (R.route === 'screen' || A.ok) loadQR();
  render();
})();
</script>
</body>
